name: CLA Check

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  cla:
    name: Contributor License Agreement
    runs-on: ubuntu-latest
    # The repository owner holds the copyright and does not need to sign the CLA.
    if: github.event.pull_request.user.login != 'jandersonss'
    steps:
      - name: Check for CLA acceptance in the pull request body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const accepted = /I have read the CLA .*and I agree to its terms/is.test(body);

            if (!accepted) {
              core.setFailed(
                'This pull request is missing the CLA acceptance statement.\n\n' +
                'Please read CLA.md and add the following line to the pull request ' +
                'description:\n\n' +
                '  I have read the CLA (CLA.md) and I agree to its terms for this and ' +
                'all my future contributions to this project.'
              );
              return;
            }

            core.info('CLA acceptance statement found.');
